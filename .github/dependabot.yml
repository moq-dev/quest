version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # The dev shell's merge driver should carry quest's latest reviewed fixes.
      exclude: ["quest-pinned"]
    groups:
      # Its own PR, so a nixpkgs bump that needs work does not hold it back.
      quest-pinned:
        patterns: ["quest-pinned"]
      nix:
        patterns: ["*"]
