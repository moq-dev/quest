name: Isolated

# Runs each Worker test case in its own process, catching a test that passes
# only on module-level state another test left behind. Too slow for every pull
# request, so it runs daily on main.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      # The build snapshots finished quests from the full history, as the Check job's does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: nix develop --command just install
      - name: Run each Worker test case alone
        run: nix develop --command just worker-test-isolated
