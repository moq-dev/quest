name: Sandbox

# The runner sandbox's boundary tests (`just runner-sandbox`), with its pool's
# limit checks, run nightly on a GitHub-hosted runner, and on pull requests that
# change the agents they check: the flake's pins, the runner's sources, the
# limit messages they match, or the tests themselves. They stay
# off the merge queue's required checks, so landing never waits on them;
# /quest-merge names a failing optional check before it queues. The job runs PR
# code, so it stays read-only and uses no secrets. GitHub reports a failed scheduled run only to the account
# that last changed the cron schedule (with Actions notifications on), not to
# the repository's watchers; that is the maintainer, whose account lands the
# workflow, so they see a boundary failure.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - flake.lock
      - flake.nix
      - nix/**
      - package.json
      - bun.lock
      - src/runner/**
      - src/cli/limit.ts
      - src/cli/review.ts
      - test/live/runner-sandbox*.ts
      - .github/workflows/sandbox.yml

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: nix develop --command just install
      # The test runs bubblewrap from the Nix store, which Ubuntu's AppArmor would
      # refuse the unprivileged user namespace it needs.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check the runner sandbox's boundary
        run: nix develop --command just runner-sandbox
