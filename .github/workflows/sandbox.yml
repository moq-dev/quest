name: Sandbox

# The runner sandbox's boundary test (`just runner-sandbox`) runs nightly on a
# GitHub-hosted runner, outside pull requests and the merge queue, so landing
# never waits on it; a failed scheduled run notifies the repository's watchers.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          determinate: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: nix develop --command just install
      # The test runs bubblewrap from the Nix store, which Ubuntu's AppArmor would
      # refuse the unprivileged user namespace it needs.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check the runner sandbox's boundary
        run: nix develop --command just runner-sandbox
